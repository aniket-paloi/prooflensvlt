name: Node.js & Bun CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies from locked bun.lock
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run lint

      - name: Build production bundle
        run: bun run build

      - name: Verify production startup and readiness endpoints
        run: |
          NODE_ENV=production PORT=3000 node server.ts &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3000/api/health/ready >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          curl -fsS http://localhost:3000/api/health/ready | grep -q '"status":"ready"'
          curl -fsS http://localhost:3000/api/cases | grep -q 'case-nair-split-payment'
          curl -fsS http://localhost:3000/api/cases | grep -q 'case-deshmukh-discrepancy'
          kill $SERVER_PID 2>/dev/null || true
